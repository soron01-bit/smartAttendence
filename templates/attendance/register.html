{% extends 'base.html' %}

{% block main_class %}dashboard-main{% endblock %}

{% block content %}
<div class="dashboard-content" style="align-items: center; justify-content: center; height: 100%; padding: 1rem;">
    <div class="registration-card">
        <!-- Left Section: Liveliness & Video -->
        <div class="reg-split-left">
            <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem; text-align: left;">Register New User</h1>
            <p class="subtitle" style="text-align: left; margin-bottom: 1rem; font-size: 0.95rem;">Follow the on-screen instructions to prove liveness.</p>

            <div id="livenessPrompt"
                style="background: rgba(99, 102, 241, 0.15); border: 1px solid var(--primary); padding: 0.8rem; text-align: center; font-weight: bold; font-size: 1rem; border-radius: 12px; margin-bottom: 1rem;">
                Step 1: Look directly at the camera
            </div>

            <div class="video-container" id="videoContainer" style="margin-bottom: 0; flex: 1;">
                <video id="video" autoplay muted playsinline style="border-radius: 16px; object-fit: cover;"></video>
                <div class="loading-text" id="loadingText">
                    <div class="spinner"></div>
                    Loading AI Models...
                </div>
            </div>
        </div>

        <!-- Right Section: Form Fields -->
        <div class="reg-split-right">
            <div style="padding-right: 0.5rem;">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="E.g. John Doe">
                </div>

                <div class="input-group">
                    <label for="instituteCode">Institute Unique Code</label>
                    <input type="text" id="instituteCode" placeholder="E.g. INST-123456">
                </div>

                <div id="dynamicFields"></div>

                <button class="btn" id="scanBtn" disabled style="margin-top: 1rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 4h5v5" />
                        <path d="M9.5 4h-5v5" />
                        <path d="M14.5 20h5v-5" />
                        <path d="M9.5 20h-5v-5" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    Complete Registration
                </button>
                <div id="statusMessage" class="status-message" style="margin-top: 1rem;"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const video = document.getElementById('video');
    const scanBtn = document.getElementById('scanBtn');
    const loadingText = document.getElementById('loadingText');
    const statusMessage = document.getElementById('statusMessage');
    const videoContainer = document.getElementById('videoContainer');
    const livenessPrompt = document.getElementById('livenessPrompt');

    let currentDescriptor = null;
    let livenessState = 0;
    let hasBlinked = false;
    let hasTurnedHead = false;
    let blinkFrames = 0;
    let earHistory = [];

    function showStatus(message, isSuccess = false) {
        statusMessage.textContent = message;
        statusMessage.className = `status-message show ${isSuccess ? 'status-success' : 'status-error'}`;
        setTimeout(() => {
            if (!isSuccess) statusMessage.classList.remove('show');
        }, 5000);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');
    const dynamicFields = document.getElementById('dynamicFields');

    if (role === 'student') {
        dynamicFields.innerHTML = `
            <div class="input-group">
                <label for="year">Year</label>
                <select id="year" style="width: 100%; padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px;">
                    <option value="" disabled selected>Select Year</option>
                    <option value="1st">1st Year</option>
                    <option value="2nd">2nd Year</option>
                    <option value="3rd">3rd Year</option>
                    <option value="4th">4th Year</option>
                </select>
            </div>
            <div class="input-group">
                <label for="semester">Semester</label>
                <select id="semester" style="width: 100%; padding: 0.8rem; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px;">
                    <option value="" disabled selected>Select Semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>
            </div>
            <div class="input-group">
                <label for="section">Section</label>
                <input type="text" id="section" placeholder="E.g. A, B, C">
            </div>
            <div class="input-group">
                <label for="studentGroup">Group</label>
                <input type="text" id="studentGroup" placeholder="E.g. G1, G2">
            </div>
            <div class="input-group">
                <label for="rollNumber">Roll Number</label>
                <input type="text" id="rollNumber" placeholder="E.g. 42">
            </div>
            <div class="input-group">
                <label for="phoneNumber">Phone Number (Optional)</label>
                <input type="text" id="phoneNumber" placeholder="E.g. +1 234 567 890">
            </div>
            <div class="input-group">
                <label for="bloodGroup">Blood Group (Optional)</label>
                <input type="text" id="bloodGroup" placeholder="E.g. O+">
            </div>
            <div class="input-group">
                <label for="guardianName">Guardian Name (Optional)</label>
                <input type="text" id="guardianName" placeholder="E.g. Jane Doe">
            </div>
        `;
    } else if (role === 'teacher') {
        dynamicFields.innerHTML = `
            <div class="input-group">
                <label for="department">Department</label>
                <input type="text" id="department" placeholder="E.g. Mathematics">
            </div>
            <div class="input-group">
                <label for="designation">Designation</label>
                <input type="text" id="designation" placeholder="E.g. Senior Professor">
            </div>
            <div class="input-group">
                <label for="phoneNumber">Phone Number (Optional)</label>
                <input type="text" id="phoneNumber" placeholder="E.g. +1 234 567 890">
            </div>
            <div class="input-group">
                <label for="bloodGroup">Blood Group (Optional)</label>
                <input type="text" id="bloodGroup" placeholder="E.g. O+">
            </div>
        `;
    } else {
        // Redir if no valid role
        window.location.href = "/";
    }

    function calculateEAR(eye) {
        // compute the euclidean distances between the two sets of vertical eye landmarks
        const d1 = Math.hypot(eye[1].x - eye[5].x, eye[1].y - eye[5].y);
        const d2 = Math.hypot(eye[2].x - eye[4].x, eye[2].y - eye[4].y);
        // compute the euclidean distance between the horizontal eye landmark (x, y)-coordinates
        const d3 = Math.hypot(eye[0].x - eye[3].x, eye[0].y - eye[3].y);
        // compute the eye aspect ratio
        return (d1 + d2) / (2.0 * d3);
    }

    async function init() {
        try {
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri('/static/models'),
                faceapi.nets.faceLandmark68Net.loadFromUri('/static/models'),
                faceapi.nets.faceRecognitionNet.loadFromUri('/static/models')
            ]);

            loadingText.style.display = 'none';

            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;

            video.onplay = () => {
                const canvas = faceapi.createCanvasFromMedia(video);
                videoContainer.append(canvas);
                const displaySize = { width: video.clientWidth, height: video.clientHeight };
                faceapi.matchDimensions(canvas, displaySize);

                async function processFrame() {
                    if (livenessState === 3) return; // already finished checking

                    const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

                    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

                    if (detection) {
                        const score = detection.detection.score;
                        const boxW = detection.detection.box.width;
                        
                        const resizedDetections = faceapi.resizeResults(detection, displaySize);
                        faceapi.draw.drawDetections(canvas, resizedDetections);

                        // Anti-spoofing Quality Checks
                        if (score < 0.85 || boxW < 140) {
                            livenessPrompt.textContent = score < 0.85 ? "Face not clear. Avoid photos or glare." : "Face too small. Move closer.";
                            livenessPrompt.style.borderColor = "red";
                            livenessState = 0;
                            hasBlinked = false;
                            hasTurnedHead = false;
                            blinkFrames = 0;
                            earHistory = [];
                            scanBtn.disabled = true;
                            setTimeout(processFrame, 20);
                            return;
                        }

                        faceapi.draw.drawFaceLandmarks(canvas, resizedDetections);

                        const landmarks = detection.landmarks;

                        // Anti-Spoofing: Detect Corrupted Landmarks (Phone Screen Glare / Moiré Patterns)
                        const leftEye = landmarks.getLeftEye();
                        const rightEye = landmarks.getRightEye();
                        const mouth = landmarks.getMouth();
                        
                        const isLeftEyeInverted = leftEye[1].y > leftEye[5].y || leftEye[2].y > leftEye[4].y;
                        const isRightEyeInverted = rightEye[1].y > rightEye[5].y || rightEye[2].y > rightEye[4].y;
                        const isMouthInverted = mouth[3].y > mouth[9].y;
                        const isAsymmetric = Math.abs(calculateEAR(leftEye) - calculateEAR(rightEye)) > 0.15;

                        if (isLeftEyeInverted || isRightEyeInverted || isMouthInverted || isAsymmetric) {
                            livenessPrompt.textContent = "Screen/Glare detected! Please use a real live face.";
                            livenessPrompt.style.borderColor = "red";
                            livenessState = 0;
                            hasBlinked = false;
                            hasTurnedHead = false;
                            blinkFrames = 0;
                            earHistory = [];
                            scanBtn.disabled = true;
                            setTimeout(processFrame, 20);
                            return;
                        }

                        // Liveliness Logic
                        if (livenessState === 0) {
                            livenessPrompt.textContent = "Please Blink slowly and Turn your head";
                            livenessPrompt.style.borderColor = "yellow";
                            livenessState = 1; // indicates tracking started
                            currentDescriptor = detection.descriptor; // Capture straight face descriptor
                            blinkFrames = 0;
                            earHistory = [];
                        }
                        else if (livenessState === 1) {
                            const currentEAR = (calculateEAR(landmarks.getLeftEye()) + calculateEAR(landmarks.getRightEye())) / 2.0;
                            earHistory.push(currentEAR);
                            if (earHistory.length > 30) earHistory.shift(); // Keep 30 frames to remember open eyes

                            const recentMaxEAR = earHistory.length > 0 ? Math.max(...earHistory) : currentEAR;

                            const noseTip = landmarks.getNose()[3];
                            const jaw = landmarks.getJawOutline();
                            const distLeft = Math.abs(noseTip.x - jaw[0].x);
                            const distRight = Math.abs(jaw[16].x - noseTip.x);
                            const headRatio = Math.max(distLeft / distRight, distRight / distLeft);
                            const isLookingStraight = headRatio < 1.5;

                            // NEW Blink Logic: Detect a definitive drop compared to recent history
                            if (!hasBlinked && earHistory.length >= 3) {
                                if (isLookingStraight && currentEAR < (recentMaxEAR * 0.82)) {
                                    blinkFrames++;
                                    if (blinkFrames >= 1) {
                                        hasBlinked = true;
                                    }
                                } else {
                                    blinkFrames = 0;
                                }
                            }

                            // Check Head Turn
                            if (!hasTurnedHead) {
                                if (headRatio > 2.8) {
                                    hasTurnedHead = true;
                                }
                            }

                            // Dynamic prompt updates
                            if (hasBlinked && !hasTurnedHead) {
                                livenessPrompt.textContent = "Blink detected! Now Turn your head left or right.";
                                livenessPrompt.style.color = "white";
                            } else if (!hasBlinked && hasTurnedHead) {
                                livenessPrompt.textContent = "Head Turn detected! Now Blink slowly.";
                                livenessPrompt.style.color = "white";
                            }

                            // Both Verified
                            if (hasBlinked && hasTurnedHead) {
                                livenessPrompt.textContent = "Liveliness verified! Click Complete Registration";
                                livenessPrompt.style.background = "rgba(16, 185, 129, 0.2)";
                                livenessPrompt.style.borderColor = "var(--accent)";
                                livenessState = 3;
                                scanBtn.disabled = false;
                            }
                        }

                    } else {
                        livenessPrompt.textContent = "Face lost. Please look at the camera.";
                        livenessPrompt.style.borderColor = "red";
                        livenessState = 0;
                        hasBlinked = false;
                        hasTurnedHead = false;
                        blinkFrames = 0;
                        earHistory = [];
                        scanBtn.disabled = true;
                    }

                    // Loop continuously without hard wait
                    setTimeout(processFrame, 20);
                }

                // Start tracking loop
                processFrame();
            };

        } catch (err) {
            loadingText.innerHTML = `Error: ${err.message}`;
            console.error(err);
        }
    }

    scanBtn.addEventListener('click', async () => {
        const name = document.getElementById('name').value.trim();
        const instituteCode = document.getElementById('instituteCode').value.trim();

        let extraParams = {};
        if (role === 'student') {
            extraParams.year = document.getElementById('year').value;
            extraParams.semester = document.getElementById('semester').value;
            extraParams.section = document.getElementById('section').value.trim();
            extraParams.student_group = document.getElementById('studentGroup').value.trim();
            extraParams.roll_number = document.getElementById('rollNumber').value.trim();
            extraParams.guardian_name = document.getElementById('guardianName').value.trim();
        } else if (role === 'teacher') {
            extraParams.department = document.getElementById('department').value.trim();
            extraParams.designation = document.getElementById('designation').value.trim();
        }

        extraParams.phone_number = document.getElementById('phoneNumber').value.trim();
        extraParams.blood_group = document.getElementById('bloodGroup').value.trim();

        if (!name || !instituteCode) {
            showStatus('Please enter a name and institute code');
            return;
        }

        if (livenessState !== 3 || !currentDescriptor) {
            showStatus('Liveliness check failed. Please refresh and try again.');
            return;
        }

        scanBtn.disabled = true;
        scanBtn.innerHTML = '<div class="spinner" style="width: 20px; height: 20px;"></div> Processing...';

        try {
            const descriptorArray = Array.from(currentDescriptor);

            const response = await fetch('/api/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    name: name,
                    role: role,
                    descriptor: descriptorArray,
                    institute_code: instituteCode,
                    ...extraParams
                })
            });

            const data = await response.json();

            if (data.success) {
                const finalMsg = `${data.message}\nYour ID: ${data.user_id}\nYour Password: ${data.password}\n\nPlease save this password.`;
                showStatus(finalMsg, true);
                statusMessage.style.whiteSpace = "pre-line"; // Allow multiline correctly
                statusMessage.style.padding = "2rem"; // Make it bigger
                statusMessage.style.fontSize = "1.1rem";

                document.getElementById('name').value = '';
                livenessState = -1; // disable further actions
                video.srcObject.getTracks().forEach(t => t.stop()); // stop cam
            } else {
                showStatus(data.message);
                scanBtn.disabled = false;
                scanBtn.innerHTML = 'Complete Registration';
            }
        } catch (err) {
            showStatus(`Error during capture: ${err.message}`);
            scanBtn.disabled = false;
            scanBtn.innerHTML = 'Complete Registration';
        }
    });
    document.addEventListener('DOMContentLoaded', init);
</script>
{% endblock %}
