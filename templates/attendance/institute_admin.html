{% extends 'base.html' %}

{% block content %}
<h1 style="text-align: center; font-size: 2.5rem; margin-top: 2rem;">Institute Management Portal</h1>
<p class="subtitle" style="text-align: center; max-width: 600px; margin: 0 auto 3rem auto; font-size: 1.1rem;">
    Access registration and management tools for your institute.
</p>

<div class="hero-grid">
    <a href="/institute/register/" class="action-card">
        <div class="action-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
        </div>
        <h2>Institute Reg.</h2>
        <p>Register a new Institute</p>
    </a>

    <a href="/institute/login/" class="action-card">
        <div class="action-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        </div>
        <h2>Institute Login</h2>
        <p>Manage Institute GPS</p>
    </a>
</div>

<div style="text-align: center; margin-top: 3rem;">
    <a href="/" class="btn" style="background: var(--surface); color: var(--text); text-decoration: none;">&larr; Back to Home</a>
</div>
{% endblock %}
